[project]
name = "sadi-demand-forecast"
version = "0.1.0"
description = "Day-ahead forecasting of Argentina's SADI electricity demand, run as a monitored service on AWS."
readme = "README.md"
license = "MIT"
authors = [{ name = "Francisco García Soriano" }]
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.80",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadi_forecast"]

[tool.ruff]
target-version = "py312"
src = ["src", "scripts", "eda", "infra/lambda", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "scripts", "eda", "infra/lambda", "tests"]
files = ["src", "scripts", "eda", "infra/lambda", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "infra/lambda"]
