name: deploy

# On every push to main (only the repository owner can push there):
#   test   - lint, types and tests, no AWS access;
#   plan   - environment "plan": read-only AWS role, prints terraform plan and a
#            fingerprint (SHA-256) of the planned changes;
#   apply  - environment "production" (manual approval): builds and pushes the image
#            (tag = commit), plans again and applies only if the fingerprint equals the
#            approved one (the plan file itself is never uploaded: it holds the alert
#            email in plain text), then publishes the page files.
# AWS access through OIDC (no stored keys). Actions pinned to commit SHAs.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  TF_IN_AUTOMATION: "1"
  TF_VERSION: "1.16.6"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  plan:
    needs: test
    runs-on: ubuntu-latest
    environment: plan
    outputs:
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=infra init -input=false
      - name: Plan (read this before approving the apply job)
        id: plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_forecaster_image_tag: ${{ github.sha }}
        run: |
          terraform -chdir=infra plan -input=false -lock=false -out=tfplan
          terraform -chdir=infra show -json tfplan | jq -cS '.resource_changes' | sha256sum | cut -c1-64 > fingerprint
          echo "Plan fingerprint: $(cat fingerprint)"
          echo "fingerprint=$(cat fingerprint)" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and push the image (skipped if this commit is already pushed)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/sadi-forecaster:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name sadi-forecaster --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "image already in ECR"
          else
            docker build --platform linux/amd64 --provenance=false -t "$IMAGE" .
            docker push "$IMAGE"
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=infra init -input=false
      - name: Apply the approved plan only
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_forecaster_image_tag: ${{ github.sha }}
          APPROVED: ${{ needs.plan.outputs.fingerprint }}
        run: |
          terraform -chdir=infra plan -input=false -out=tfplan
          NOW=$(terraform -chdir=infra show -json tfplan | jq -cS '.resource_changes' | sha256sum | cut -c1-64)
          echo "approved: $APPROVED"
          echo "now:      $NOW"
          if [ -z "$APPROVED" ] || [ "$NOW" != "$APPROVED" ]; then
            echo "The plan changed after approval. Nothing applied; re-run the workflow and review the new plan."
            exit 1
          fi
          terraform -chdir=infra apply -input=false tfplan
      - name: Publish the page files
        run: |
          SITE=$(terraform -chdir=infra output -raw site_bucket)
          aws s3 sync site "s3://$SITE/" --exclude data.json --delete
